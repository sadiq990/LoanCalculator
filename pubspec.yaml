name: loan_calculator
description: "Loan Tracker - Privacy-first, local-only loan tracker and payoff planner."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  provider: ^6.1.1
  pdf: ^3.10.8
  printing: ^5.11.0
  fl_chart: ^1.1.1
  local_auth: ^3.0.0
  uuid: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  decimal: ^2.3.3
  rational: ^2.2.3
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  flutter_secure_storage: ^10.3.4
  cryptography: ^2.9.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/icon.png
  ios: true
  android: true
  fullscreen: true
